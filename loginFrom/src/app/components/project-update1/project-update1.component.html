<app-layout></app-layout>
<div class="container">
    <h2>Edit Project</h2>
    <form>
        
        <div class="form-group">
            <label>project Id</label>
            <input class="form-control" type="text" value={{project.proj_id}}  aria-label="Disabled input example" disabled readonly>
          </div>
      <div class="form-group">
        <label for="proj_name">Project Name</label>
        <input type="text" class="form-control" id="proj_name" [(ngModel)]="project.proj_name" id="disabledInput" name="proj_name" required>
      </div>
      <div class="form-group">
        <label for="proj_owner">Project Owner</label>
        <input type="text" class="form-control" id="proj_owner" [(ngModel)]="project.proj_owner" name="proj_owner" required>
      </div>
      <div class="form-group">
        <label>project created date</label>
        <input class="form-control" type="text" value={{project.proj_created_date}} aria-label="Disabled input example" disabled readonly>
      </div>
      <div class="form-group">
        <label for="proj_description">Description</label>
        <textarea class="form-control" id="proj_description" [(ngModel)]="project.proj_description" name="proj_description"></textarea>
      </div>
      <!-- <div class="form-group">
        <label>project created date</label>
        <input class="form-control" type="text" value={{project.user.user_id}}  aria-label="Disabled input example" disabled readonly>
      </div> -->
     
      <button type="submit" class="btn btn-primary" (click)="updateProject()">Update</button>
      <button type="submit" class="btn btn-primary" [routerLink]="['/project-list']" >Cancel</button>
    </form>
    
  </div>
