  <div class="container mt-5">
    <h2>Update Task</h2>
    <form [formGroup]="taskForm">
      <div class="form-group">
        <label for="title">Task Title</label>
        <input id="title" formControlName="title" class="form-control" />
      </div>
  
      <div class="form-group">
        <label for="task_start_date">Start Date</label>
        <input type="date" id="task_start_date" formControlName="task_start_date" class="form-control" />
      </div>
  
      <div class="form-group">
        <label for="task_update_date">Update Date</label>
        <input type="date" id="task_update_date" formControlName="task_update_date" class="form-control" />
      </div>
  
      <div class="form-group">
        <label for="task_end_date">End Date</label>
        <input type="date" id="task_end_date" formControlName="task_end_date" class="form-control" />
      </div>
  
      <!-- Dropdown for Task Status -->
      <!-- <div class="form-group">
        <label for="task_status">Status</label>
        <select id="task_status" formControlName="task_status" class="form-control">
          <option *ngFor="let status of statuses" [value]="status">{{ status }}</option>
        </select>
      </div> -->
  

      <div class="form-group">
        <label for="task_status">Status</label>
        <select id="task_status" formControlName="task_status" class="form-control">
          <option *ngFor="let status of filteredStatuses" [value]="status">{{ status }}</option>
        </select>
      </div>

      
      <div class="form-group">
        <label for="task_assigne">Assignee</label>
        <input id="task_assigne" formControlName="task_assigne" class="form-control" />
      </div>
  
      <div class="form-group">
        <label for="task_description">Description</label>
        <textarea id="task_description" formControlName="task_description" class="form-control"></textarea>
      </div>
  
      <div class="form-group">
        <label for="task_comments">Comments</label>
        <textarea id="task_comments" formControlName="task_comments" class="form-control"></textarea>
      </div>
  
      <div class="form-group">
        <label for="task_reported">Reported By</label>
        <input id="task_reported" formControlName="task_reported" class="form-control" />
      </div>
  
      <button type="submit" (click)="onUpdate()" class="btn btn-primary">Update Task</button>
      <button type="button" (click)="onCancel()" class="btn btn-primary">Cancel</button>
    </form>
  </div>
